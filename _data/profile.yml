tagline: Relational databases by day, system-log detective by night.

# Each paragraph is a separate list item.
about:
  - >-
    I'm a PhD candidate in Computer Science at the University of Auckland. I
    work on two puzzles: how to design relational databases that stay correct
    without costing a fortune to update, and how to catch the anomalies hiding
    in system logs.
  - >-
    Textbooks tell you to reach Third Normal Form, or Boyce-Codd where you can,
    but not how to choose among the many schemata that qualify. I make that
    choice measurable. Counting the minimal keys and functional dependencies a
    schema exhibits exposes a concrete trade-off between how many ways an
    entity can be addressed and how much work each update costs, and my mixed
    covers hand as much of a constraint set as possible to the keys that
    database systems already enforce natively.
  - >-
    I also discover constraints hidden in data, and build graph-based models
    that find anomalies in system logs, down to the file level and including
    anomalies never seen in training. My work has appeared at SIGMOD and VLDB,
    and in TKDE, the VLDB Journal and EAAI.

# The Research card: one line each, in order. `icon` picks the doodle used as
# its bullet: database | key | search | log (see README for the rest).
# HTML is allowed; <strong> marks the phrase a skimming eye should catch.
interests:
  - icon: database
    text: >-
      <strong>Normal forms by the numbers</strong>: choosing among 3NF and BCNF
      schemata by counting their minimal keys and functional dependencies.
  - icon: key
    text: >-
      <strong>Mixed covers</strong> that let the keys a database already
      enforces do most of the integrity work.
  - icon: search
    text: >-
      <strong>Dependency discovery</strong>: finding the rules a dataset
      actually satisfies, such as cross joins.
  - icon: log
    text: >-
      <strong>Log anomaly detection</strong> with graph models, down to the
      file level and to anomalies never seen in training.

