tagline: Relational databases by day, system-log detective by night.

# Each paragraph is a separate list item.
about:
  - >-
    I'm a PhD candidate in Computer Science at the University of Auckland. I
    work on two puzzles: how to design relational databases that stay correct
    without costing a fortune to update, and how to catch the anomalies hiding
    in system logs.
  - >-
    Textbooks tell you to reach Third Normal Form, or Boyce-Codd where you can,
    but not how to choose among the many schemata that qualify. I make that
    choice measurable. Counting the minimal keys and functional dependencies a
    schema exhibits exposes a concrete trade-off between how many ways an
    entity can be addressed and how much work each update costs, and my mixed
    covers hand as much of a constraint set as possible to the keys that
    database systems already enforce natively.
  - >-
    I also discover constraints hidden in data, and build graph-based models
    that find anomalies in system logs, down to the file level and including
    anomalies never seen in training. My work has appeared at SIGMOD and VLDB,
    and in TKDE, the VLDB Journal and EAAI.

# One card each. `icon` picks the doodle: database | key | search | log.
interests:
  - name: Normal forms, by the numbers
    icon: database
    detail: >-
      Textbook design stops at "3NF, and BCNF where possible", which admits many
      schemata and gives no principled way to pick one. I parameterize BCNF by
      its number of minimal keys, and 3NF by its numbers of minimal keys and
      functional dependencies, so the cost of keeping data consistent becomes
      something you can measure and optimize at design time.
  - name: Letting keys do the work
    icon: key
    detail: >-
      Database systems enforce keys natively but leave functional dependencies
      to triggers or application code. A mixed cover pairs the minimal keys with
      a cover of the remaining FDs: orders of magnitude less integrity
      maintenance, and faster queries, refreshes and inserts on
      <span class="nb">TPC-H</span>.
  - name: Finding the rules in data
    icon: search
    detail: >-
      Which dependencies does a dataset actually satisfy? For cross joins I
      settled the complexity (NP-complete, and W[3]-complete in the arity) and
      gave the first algorithms to discover them, including approximate ones
      that trade discovery time against a target ratio.
  - name: Catching trouble in logs
    icon: log
    detail: >-
      Graph models capture how log events depend on each other but overlook the
      small substructures that give a fault away. My recent work finds those
      substructures and distills them for fast inference, and extends detection
      to the file level and to anomalies never seen in training.

